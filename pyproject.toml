[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roadmatch"
version = "0.1.0"
description = "Recover likely real road-network routes from noisy optical-cable crossing detections."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Roadmatch Contributors" }
]
dependencies = [
  "osmnx>=2.1.0",
  "networkx>=3.2",
  "geopandas>=0.14",
  "shapely>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
roadmatch = "roadmatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
